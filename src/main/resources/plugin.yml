name: BedWars1058-Compass
version: '${version}'
main: dev.etran.bedwars1058compass.BedWars1058Compass
api-version: '1.13'
authors: [etran]
description: Hypixel-style player tracker compass for BedWars1058.
depend: [BedWars1058]

commands:
  bwcompass:
    description: BedWars1058-Compass admin command
    usage: /bwcompass [status|reload|config]

permissions:
  bwcompass.admin:
    description: Everything under /bwcompass
    default: op
    children:
      bwcompass.reload: true
      bwcompass.config: true
  bwcompass.reload:
    description: Allows /bwcompass reload
    default: false
  bwcompass.config:
    description: Allows /bwcompass config (editing config.yml in game)
    default: false
